# Tendero's sign-in page: Keycloak's own login theme (keycloak.v2, PatternFly 5),
# dressed in the shop's tokens. It replaces no template: everything Keycloak
# renders — every step, every error, every translation — stays Keycloak's, and
# only how it looks is the shop's. ADR 0065 says why, keycloak/README.md how.
parent=keycloak.v2
import=common/keycloak

# The typefaces first (an @import of a URL must open its stylesheet), then
# Keycloak's own styles, then the shop's tokens and what maps them onto
# PatternFly. fonts.css, tokens.css and img/tendero-icon.svg are GENERATED by
# tools/tokens.mjs from design/ and the shop's brand: never edit them here.
styles=css/fonts.css css/styles.css css/tokens.css css/tendero.css

# Follows the device's light or dark the way the shop's tokens expect: with
# data-theme on <html>, before the first paint.
scripts=js/tendero.js

# The shop's two languages; the realm turns them on and the storefront asks for
# its own with ui_locales.
locales=es,en
