<header class="flex items-center gap-3" *transloco="let t">
  <!-- Back from the sheet below 1024 px; beside the list, Close says it instead. -->
  <button
    type="button"
    class="inline-grid min-h-[2.75rem] min-w-[2.75rem] place-items-center rounded-md px-2 text-sm text-muted hover:bg-raised hover:text-body lg:hidden"
    (click)="closed.emit()"
  >
    {{ t('pane.back') }}
  </button>
  <h2
    class="min-w-0 flex-1 text-lg focus:outline-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus focus-visible:outline-solid"
    [id]="headingId"
    tabindex="-1"
    #title
  >
    {{ heading() }}
  </h2>
  <button
    type="button"
    class="inline-grid min-h-[2.75rem] min-w-[2.75rem] place-items-center rounded-md px-2 text-sm text-muted hover:bg-raised hover:text-body max-lg:hidden"
    [attr.aria-label]="t('pane.close')"
    (click)="closed.emit()"
  >
    <lib-icon name="close" />
  </button>
</header>
<ng-content />
