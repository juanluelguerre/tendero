<!-- It takes what the filters leave of the row, and goes under them when that is less than 14rem. -->
<label class="flex flex-[1_1_14rem]">
  <span class="sr-only">{{ label() }}</span>
  <input
    type="search"
    class="min-h-[2.5rem] w-full rounded-md border border-hairline-strong bg-raised px-3 text-body"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="searched.emit($any($event.target).value)"
  />
</label>
