@for (option of options(); track option.key) {
  <button
    type="button"
    class="inline-flex min-h-control-md flex-none items-center gap-2 rounded-full border border-hairline px-3 text-xs text-muted hover:border-hairline-strong hover:text-body aria-pressed:border-accent aria-pressed:bg-accent-tint aria-pressed:font-semibold aria-pressed:text-body"
    [attr.aria-pressed]="option.key === selected()"
    (click)="chosen.emit(option.key)"
  >
    <span class="chip__label inline-flex flex-col" [attr.data-label]="option.label">{{ option.label }}</span>
    @if (option.count !== null) {
      <!-- `chip__count` is a hook: the campaigns' spec reads the counts by it. -->
      <span class="chip__count numeric text-3xs text-muted">{{ option.count }}</span>
    }
  </button>
}
