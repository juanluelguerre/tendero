<ng-container *transloco="let t; prefix: 'orders'">
  <lib-status-pill [tone]="tone()">{{ t('status.' + order().status) }}</lib-status-pill>
  <!-- A rehearsal a test credential placed (ADR 0038): never shipped, its
       stock already given back. Said beside the status so nobody prepares a
       parcel for it. -->
  @if (order().mode === 'Test') {
    <span class="tag tag--code ms-2" [title]="t('testHint')">{{ t('test') }}</span>
  }
  <!-- Placed by an agent under a mandate a platform signed (P11-5). -->
  @if (order().mandate; as mandate) {
    <span class="tag tag--code ms-2" [title]="t('mandateHint', { issuer: mandate.issuer })">{{ t('mandate') }}</span>
  }
  @if (order().stopCode) {
    <!-- Why an order stopped, under its status: one size down, read second. -->
    <span class="mt-1 block text-xs text-muted" [title]="order().stopDetail ?? ''">
      {{ t('stop.' + order().stopCode) }}
      @if (order().stopDetail) {
        <span class="block font-mono tabular-nums">{{ order().stopDetail }}</span>
      }
    </span>
  }
</ng-container>
