<ng-container *transloco="let t; prefix: 'orders.export'">
  <button type="button" class="button button--quiet" [attr.aria-expanded]="open()" (click)="open.set(!open())">
    {{ t('title') }}
  </button>

  @if (open()) {
    <section class="mt-4 mb-5 grid gap-3 text-sm" [attr.aria-label]="t('title')">
      <p class="text-muted">{{ t('hint') }}</p>
      <div class="flex flex-wrap items-end gap-3">
        <label class="grid gap-2">
          <span>{{ t('from') }}</span>
          <input type="date" class="field" [formField]="store.spanForm.from" />
        </label>
        <label class="grid gap-2">
          <span>{{ t('to') }}</span>
          <input type="date" class="field" [formField]="store.spanForm.to" />
        </label>
        <button
          type="button"
          class="button button--quiet"
          data-download
          [disabled]="store.downloading()"
          (click)="download()"
        >
          {{ store.downloading() ? t('downloading') : t('download') }}
        </button>
      </div>
      @if (store.problem(); as problem) {
        <p class="failed" role="alert">{{ problem }}</p>
      }
    </section>
  }
</ng-container>
