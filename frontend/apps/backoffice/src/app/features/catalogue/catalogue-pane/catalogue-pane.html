@if (store.selected(); as item) {
  <ng-container *transloco="let t">
  <backoffice-worklist-pane [heading]="item.name" (closed)="closed.emit()">
    <div class="pane-status"><backoffice-product-status-tags [product]="item" /></div>
    <backoffice-product-review [code]="item.code" />

    @if (item.status === 'Draft') {
      <button type="button" class="button pane-primary" [disabled]="store.busy() === item.productId" (click)="store.publish(item)">
        {{ store.busy() === item.productId ? t('reviewQueue.publishing') : t('reviewQueue.publishLong') }}
      </button>
    } @else if (item.status === 'Active') {
      <!-- Undoable, so it does not ask: it offers Undo, which is publishing again. -->
      <button type="button" class="button button--quiet pane-primary" [disabled]="store.busy() === item.productId" (click)="store.withdraw(item)">
        {{ store.busy() === item.productId ? t('catalogue.withdrawing') : t('catalogue.withdraw') }}
      </button>
      <p class="muted hint">{{ t('catalogue.withdrawHint') }}</p>
    }
    <a class="quiet-link" [routerLink]="['/products', item.productId, 'variants']">{{ t('variants.title') }}</a>
  </backoffice-worklist-pane>
  </ng-container>
}
