<ng-container *transloco="let t; prefix: 'catalogue.exports'">
  <button type="button" class="button button--quiet" [attr.aria-expanded]="open()" (click)="open.set(!open())">
    {{ t('title') }}
  </button>

  @if (open()) {
    <section class="mt-4 mb-5 grid gap-3 text-sm" [attr.aria-label]="t('title')">
      <p class="text-muted">{{ t('feedHint') }}</p>
      <ul class="grid gap-2">
        @for (feed of feeds; track feed.culture) {
          <li class="flex flex-wrap items-center gap-3">
            <span>{{ t('feed.' + feed.culture) }}</span>
            <a class="quiet-link break-all" data-feed [href]="feed.url" target="_blank" rel="noopener">{{
              feed.url
            }}</a>
            <button type="button" class="button button--quiet" (click)="copy(feed.url)">
              {{ copied() === feed.url ? t('copied') : t('copy') }}
            </button>
          </li>
        }
      </ul>

      <p class="text-muted">{{ t('catalogueHint') }}</p>
      <div class="flex flex-wrap items-center gap-3">
        <button
          type="button"
          class="button button--quiet"
          data-download="shopify-csv"
          [disabled]="store.downloading()"
          (click)="download('shopify-csv')"
        >
          {{ store.downloading() ? t('downloading') : t('shopify') }}
        </button>
      </div>
      @if (store.problem(); as problem) {
        <p class="failed" role="alert">{{ problem }}</p>
      }
    </section>
  }
</ng-container>
