<section class="worklist-layout">
  <backoffice-claim-list class="worklist-list" />
</section>

@if (store.selected()) {
  <backoffice-claim-pane *backofficeSidePane (closed)="store.close()" (reviewAll)="reviewAll($event)" />
}

<backoffice-claims-bulk-review (decided)="approved()" (openClaim)="store.openById($event.claimId, $event.productId)" />
