<section class="worklist-layout" [class.worklist-layout--with-pane]="store.selected()">
  <backoffice-claim-list class="worklist-list" />
  <backoffice-claim-pane (closed)="store.close()" (reviewAll)="reviewAll($event)" />
</section>

<backoffice-claims-bulk-review (decided)="approved()" (openClaim)="store.openById($event.claimId, $event.productId)" />
