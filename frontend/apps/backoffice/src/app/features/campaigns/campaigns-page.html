<section class="worklist-layout" [class.worklist-layout--with-pane]="store.paneOpen()" *transloco="let t; prefix: 'campaigns'">
  <backoffice-campaign-list class="worklist-list" />

  @if (store.paneOpen()) {
    <backoffice-worklist-pane [heading]="selectedName() ?? t('new')" (closed)="store.close()">
      <backoffice-campaign-editor [campaign]="store.selected()" />
    </backoffice-worklist-pane>
  }
</section>
