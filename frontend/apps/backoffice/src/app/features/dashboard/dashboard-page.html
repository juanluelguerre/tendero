<section class="dashboard" *transloco="let t">
  <header class="page-head">
    <h1 class="page-title">{{ t('dashboard.title') }}</h1>
    <div class="page-actions">
      <div class="periods" role="group" [attr.aria-label]="t('dashboard.period.label')">
        @for (option of periods; track option) {
          <button
            type="button"
            class="button button--small button--quiet period"
            [attr.data-period]="option"
            [class.period--active]="option === period()"
            [attr.aria-pressed]="option === period()"
            (click)="choose(option)"
          >
            {{ t('dashboard.period.' + option) }}
          </button>
        }
      </div>
    </div>
  </header>
  <p class="page-hint">{{ t('dashboard.hint') }}</p>

  <nav class="tabs" [attr.aria-label]="t('dashboard.tabs.label')">
    @for (tab of tabs; track tab) {
      <a
        class="tab"
        [routerLink]="linkOf(tab)"
        [queryParams]="{ period: queryOfPeriod(period()) }"
        routerLinkActive="tab--active"
        [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }"
        ariaCurrentWhenActive="page"
      >
        {{ t('dashboard.tabs.' + tab) }}
      </a>
    }
  </nav>

  <router-outlet />
</section>
