<section *transloco="let t; prefix: 'dashboard.lab'">
  <h1 class="page-title">{{ t('title') }}</h1>
  <p class="page-hint">{{ t('hint') }}</p>
  <div class="engines">
    <article class="panel engine">
      <h2>SVG</h2>
      <button type="button" class="button button--quiet" (click)="redraw('svg')">{{ t('redraw') }}</button>
      @if (timings().svg; as measured) { <p role="status" class="numeric">{{ measured }}</p> }
      <backoffice-svg-engine-box [data]="svgData()" [format]="format" [caption]="caption()" />
    </article>
    <article class="panel engine">
      <h2>ECharts</h2>
      <button type="button" class="button button--quiet" (click)="redraw('echarts')">{{ t('redraw') }}</button>
      @if (timings().echarts; as measured) { <p role="status" class="numeric">{{ measured }}</p> }
      <backoffice-echarts-engine-box [data]="echartsData()" [format]="format" [caption]="caption()" />
    </article>
  </div>
</section>
