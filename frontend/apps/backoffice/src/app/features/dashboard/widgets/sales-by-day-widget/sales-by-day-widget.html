<backoffice-widget-frame
  *transloco="let t; prefix: 'dashboard.salesByDay'"
  [heading]="t('title')"
  [resource]="store.series"
  [loadingText]="t('loading')"
  [failedText]="t('failed')"
>
  <ng-template>
    @if (store.chart(); as data) {
      <backoffice-bar-chart [data]="data" [format]="format()" [caption]="t('title')" />
    }
  </ng-template>
</backoffice-widget-frame>
