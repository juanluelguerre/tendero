<backoffice-widget-frame
  *transloco="let t; prefix: 'dashboard.bestSellers'"
  [heading]="t('title')"
  [resource]="store.sales"
  [loadingText]="t('loading')"
  [failedText]="t('failed')"
>
  <ng-template>
    @if (store.sales.value(); as summary) {
      @if (summary.bestSellers.length === 0) {
        <p class="muted">{{ t('nothingSold') }}</p>
      } @else {
        <ol class="ranking">
          @for (seller of summary.bestSellers; track seller.sku) {
            <li class="ranking__row">
              <span class="ranking__name" [title]="seller.sku">{{ seller.name }}</span>
              <span class="muted numeric">{{ t('unitCount', { count: seller.units }) }}</span>
              <span class="numeric">{{ money(seller.revenue) }}</span>
            </li>
          }
        </ol>
      }
    }
  </ng-template>
</backoffice-widget-frame>
