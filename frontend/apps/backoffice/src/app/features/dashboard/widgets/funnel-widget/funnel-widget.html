<backoffice-widget-frame
  *transloco="let t; prefix: 'dashboard.funnel'"
  [heading]="t('title')"
  [resource]="store.funnel"
  [loadingText]="t('loading')"
  [failedText]="t('failed')"
>
  <ng-template>
    @if (store.funnel.value(); as figures) {
      <p class="mb-3 flex items-baseline gap-2">
        <span class="numeric text-xl font-semibold">{{ share(figures.conversion) }}</span>
        <span class="muted">{{ t('conversion') }}</span>
      </p>

      <ul class="grid gap-2">
        @for (step of store.steps(); track step.key) {
          <li class="grid grid-cols-[minmax(6rem,9rem)_1fr_auto] items-center gap-2 text-xs">
            <span>{{ t(step.key) }}</span>
            <span class="h-2 overflow-hidden rounded-sm bg-raised" aria-hidden="true">
              <!-- What checked out in green, what was abandoned in red; the rest in grey. -->
              <span
                class="block h-full"
                [class.bg-positive]="step.key === 'checkedOut'"
                [class.bg-danger]="step.key === 'abandoned'"
                [class.bg-muted]="step.key !== 'checkedOut' && step.key !== 'abandoned'"
                [style.inline-size.%]="step.share * 100"
              ></span>
            </span>
            <span class="numeric">{{ step.count }}</span>
          </li>
        }
      </ul>
    }
  </ng-template>
</backoffice-widget-frame>
