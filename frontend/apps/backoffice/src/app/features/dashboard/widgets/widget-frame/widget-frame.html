<article class="panel flex h-full flex-col gap-3 overflow-visible p-4">
  <header class="flex flex-wrap items-baseline justify-between gap-2">
    <h2 class="text-md">{{ heading() }}</h2>
    @if (link(); as path) {
      <a class="inline-flex min-h-target items-center text-xs text-muted" [routerLink]="path">{{ linkText() }}</a>
    }
    <!-- What else the head says, marked `frame-aside`: the key figures' "against the period before". -->
    <ng-content select="[frame-aside]" />
  </header>

  @if (isLoading()) {
    <p class="muted" role="status">{{ loadingText() }}</p>
  } @else if (isFailed()) {
    <p class="failed" role="alert">{{ failedText() }}</p>
  } @else {
    <ng-container [ngTemplateOutlet]="body()" />
  }
</article>
