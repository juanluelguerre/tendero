<backoffice-widget-frame
  *transloco="let t; prefix: 'dashboard.byCategory'"
  [heading]="t('title')"
  [resource]="store.mix"
  [loadingText]="t('loading')"
  [failedText]="t('failed')"
>
  <ng-template>
    @if (chart(); as data) {
      <!-- The chart from L, where its axis has room; a list below it, read rather than seen. -->
      <div class="at-l">
        <backoffice-bar-chart [data]="data" layout="rows" [format]="money" [caption]="t('title')" />
      </div>
      <ol class="ranking below-l">
        @for (row of store.rows(); track row.key) {
          <li class="ranking__row">
            <span class="ranking__name">{{ row.label }}</span>
            <span class="numeric">{{
              row.revenue | price: store.mix.value()?.currency ?? 'EUR' : culture.active()
            }}</span>
          </li>
        }
      </ol>
      <p class="muted text-3xs">{{ t('lines') }}</p>
    } @else {
      <p class="muted">{{ t('nothingSold') }}</p>
    }
  </ng-template>
</backoffice-widget-frame>
