<backoffice-widget-frame
  *transloco="let t; prefix: 'dashboard.customers'"
  [heading]="t('title')"
  [resource]="store.funnel"
  [loadingText]="t('loading')"
  [failedText]="t('failed')"
>
  <ng-template>
    @if (store.funnel.value(); as figures) {
      <dl class="facts">
        <div class="fact">
          <dt>{{ t('newCustomers') }}</dt>
          <dd class="fact__value numeric">{{ figures.newCustomers }}</dd>
        </div>
        <div class="fact">
          <dt>{{ t('returningCustomers') }}</dt>
          <dd class="fact__value numeric">{{ figures.returningCustomers }}</dd>
        </div>
      </dl>
      @if (store.byDay(); as data) {
        <div class="at-m">
          <backoffice-bar-chart [data]="data" layout="columns" [format]="count" [caption]="t('byDay')" />
        </div>
      } @else {
        <p class="muted">{{ t('nobody') }}</p>
      }
      <p class="muted text-3xs">{{ t('noVisits') }}</p>
    }
  </ng-template>
</backoffice-widget-frame>
