<backoffice-widget-frame
  *transloco="let t; prefix: 'dashboard.returns'"
  [heading]="t('title')"
  link="/returns"
  [linkText]="t('toReturns')"
  [resource]="store.operations"
  [loadingText]="t('loading')"
  [failedText]="t('failed')"
>
  <ng-template>
    @if (store.operations.value(); as ops) {
      <dl class="facts">
        <div class="fact">
          <dt>
            <a class="fact__link" routerLink="/returns">{{ t('openReturns') }}</a>
          </dt>
          <dd class="fact__value numeric">{{ ops.openReturns }}</dd>
        </div>
        <div class="fact">
          <dt>{{ t('returnRate') }}</dt>
          <dd class="fact__value numeric">{{ share(ops.returnRate) }}</dd>
        </div>
        <div class="fact">
          <dt>{{ t('refunded') }}</dt>
          <dd class="fact__value numeric">{{ ops.refunded | price: ops.currency : culture.active() }}</dd>
        </div>
      </dl>
      @if (store.chart(); as data) {
        <div class="at-m">
          <backoffice-bar-chart [data]="data" layout="rows" [format]="count" [caption]="t('byReason')" />
        </div>
      } @else {
        <p class="muted">{{ t('nothingOpen') }}</p>
      }
    }
  </ng-template>
</backoffice-widget-frame>
