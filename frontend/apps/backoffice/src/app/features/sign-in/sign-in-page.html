<div class="stage" *transloco="let t">
  <section class="panel card">
    <img class="card__mark" src="brand/tendero-icon-backoffice.svg" alt="" aria-hidden="true"
         width="36" height="36" />
    <h1 class="card__title">{{ t('signIn.title') }}</h1>

    <!-- Why they are here, when the answer is not "they arrived". A session that
         ended without anybody pressing anything is the one case where the door
         owes an explanation, and the copy says what happened and what to do. -->
    @if (expired) {
      <p class="notice" role="status">{{ t('signIn.expired') }}</p>
    }

    @if (issuer) {
      <p class="muted card__hint">{{ t('signIn.hint') }}</p>

      <!-- The one clay action on this view, and the only thing it does is leave.
           Who may sign in, and what they have to type, belongs to the issuer. -->
      <button type="button" class="button" (click)="signIn()">
        {{ t('signIn.continue') }}
      </button>

      <!-- Naming the issuer is not decoration: you are about to be sent to
           another origin, and a page that hands you off without saying where is
           a page that has trained you to ignore that. -->
      <p class="muted card__issuer">{{ t('signIn.via.' + issuer) }}</p>
    } @else {
      <p class="failed" role="alert">{{ t('signIn.noIssuer') }}</p>
    }
  </section>
</div>
