<!-- Centred in what is left of the viewport under the bar, not floated in the
     middle of a dark page: with no tabs and no data, a card is the only thing
     that tells you where to look. -->
<div class="grid min-h-[60dvh] place-items-center py-6" *transloco="let t">
  <section class="panel w-full max-w-[26rem] p-6">
    <img
      class="mb-4 block size-[36px]"
      src="brand/tendero-icon-backoffice.svg"
      alt=""
      aria-hidden="true"
      width="36"
      height="36"
    />
    <h1 class="text-lg">{{ t('signIn.title') }}</h1>

    <!-- Why they are here, when the answer is not "they arrived". A session that
         ended without anybody pressing anything is the one case where the door
         owes an explanation, and the copy says what happened and what to do. -->
    @if (expired) {
      <lib-notice class="mt-3" tone="warn" live="polite">{{ t('signIn.expired') }}</lib-notice>
    }

    @if (wrongRole(); as who) {
      <!-- Signed in, and not as somebody this backoffice is for. Offering
           "continue to sign in" here would send them to the issuer as the same
           person and straight back to this page. -->
      <lib-notice class="mt-3" tone="warn" live="polite">{{
        t('signIn.wrongRole', { name: who.name, role: who.role })
      }}</lib-notice>
      <button type="button" class="button" (click)="signOut()">
        {{ t('signIn.signOut') }}
      </button>
    } @else if (issuer) {
      <p class="muted mt-2 mb-5 text-xs">{{ t('signIn.hint') }}</p>

      <!-- The one clay action on this view, and the only thing it does is leave.
           Who may sign in, and what they have to type, belongs to the issuer. -->
      <button type="button" class="button" (click)="signIn()">
        {{ t('signIn.continue') }}
      </button>

      <!-- Naming the issuer is not decoration: you are about to be sent to
           another origin, and a page that hands you off without saying where is
           a page that has trained you to ignore that. -->
      <p class="muted">{{ t('signIn.via.' + issuer) }}</p>
    } @else {
      <p class="failed" role="alert">{{ t('signIn.noIssuer') }}</p>
    }
  </section>
</div>
