<section class="worklist-layout" [class.worklist-layout--with-pane]="store.selected()" *transloco="let t; prefix: 'agents'">
  <div class="worklist-list">
    <backoffice-agent-list />
    <backoffice-agent-register />
  </div>

  <backoffice-agent-pane (closed)="store.close()" />

  <!-- Asked from the row and from the pane: it belongs to the page. -->
  <backoffice-confirm-dialog
    tone="normal"
    [heading]="t('suspendTitle', { agent: store.suspending()?.agent?.displayName ?? '' })"
    [body]="t('suspendBody')"
    [reasonLabel]="t('reason')"
    [reasonRequired]="true"
    [keepLabel]="t('cancel')"
    [confirmLabel]="t('suspend')"
    (confirmed)="store.suspend($event)"
  />
</section>
