@if (door.isOpen()) {
  @if (wide()) {
    <!-- The panel loads as soon as the door opens (on immediate): the person has asked
         for it, and the default — when the browser is idle — can be seconds on a busy
         screen, an empty column in the meantime. -->
    <aside class="h-full w-panel border-s border-hairline bg-surface" [attr.aria-label]="name()">
      @defer (on immediate) {
        <backoffice-steward-panel class="h-full" />
      }
    </aside>
  } @else {
    <!-- The sheet: a modal dialog, full screen. Esc closes it through its own
         close event, which closes the door too. -->
    <dialog
      class="m-0 ms-auto h-dvh max-h-none w-full max-w-none border-0 bg-surface p-0 text-body md:w-panel md:border-s md:border-hairline"
      #sheet
      (close)="door.close()"
      [attr.aria-label]="name()"
    >
      @defer (on immediate) {
        <backoffice-steward-panel class="h-full" />
      }
    </dialog>
  }
}
