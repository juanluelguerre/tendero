<ng-container *transloco="let t">
  <figure class="m-0 grid gap-1">
    <figcaption class="eyebrow">{{ t('steward.tables.' + table().key) }}</figcaption>
    <div class="overflow-x-auto">
      <table class="table">
        <thead>
          <tr>
            @for (column of table().columns; track column.key) {
              <th [class.text-end]="numeric()[$index]">{{ t('steward.columns.' + column.key) }}</th>
            }
          </tr>
        </thead>
        <tbody>
          @for (row of rows(); track $index) {
            <tr>
              @for (cell of row; track $index) {
                <td [class.text-end]="numeric()[$index]" [class.tabular-nums]="numeric()[$index]">
                  {{ cell.term ? t('steward.terms.' + cell.text) : cell.text }}
                </td>
              }
            </tr>
          }
        </tbody>
      </table>
    </div>
  </figure>
</ng-container>
