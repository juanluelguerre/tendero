<ng-container *transloco="let t">
  <figure class="m-0 grid gap-1">
    <figcaption class="eyebrow">{{ t('steward.tables.' + table().key) }}</figcaption>
    <div class="overflow-x-auto">
      <table class="table text-2xs">
        <thead>
          <tr>
            @for (heading of headings(); track heading.key) {
              <th class="px-2 py-2" [class.text-end]="heading.numeric">{{ t('steward.columns.' + heading.key) }}</th>
            }
          </tr>
        </thead>
        <tbody>
          @for (row of rows(); track $index) {
            <tr>
              @for (cell of row; track $index) {
                <!-- Figures and the row's own code keep to one line; a name wraps. -->
                <td
                  class="px-2 py-2"
                  [class.text-end]="cell.numeric"
                  [class.tabular-nums]="cell.numeric"
                  [class.whitespace-nowrap]="cell.numeric || $first"
                >
                  {{ cell.term ? t('steward.terms.' + cell.text) : cell.text }}
                </td>
              }
            </tr>
          }
        </tbody>
      </table>
    </div>
    @if (long()) {
      <button
        type="button"
        class="button button--small button--quiet justify-self-start"
        [attr.aria-expanded]="expanded()"
        (click)="expanded.set(!expanded())"
      >
        {{ expanded() ? t('steward.table.showFewer') : t('steward.table.showAll', { count: total() }) }}
      </button>
    }
  </figure>
</ng-container>
