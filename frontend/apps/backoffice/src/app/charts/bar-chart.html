<figure class="chart grid gap-3" *transloco="let t; prefix: 'charts.figures'">
  <figcaption class="sr-only">{{ caption() }}</figcaption>
  <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
    <ul class="legend flex gap-4 text-2xs text-muted">
      @for (series of data().series; track series.key) {
        <li class="inline-flex items-center gap-2"><span class="size-[0.625rem] rounded-[2px]" [style.background]="colour(series.role)"></span>{{ series.label }}</li>
      }
    </ul>
    <!-- 24px at least, WCAG 2.2's target size: the accessibility ratchet found it at 18. -->
    <button type="button" class="figures-toggle inline-flex min-h-[1.5rem] items-center text-2xs text-muted underline hover:text-body"
      [attr.aria-expanded]="figuresShown()" [attr.aria-controls]="tableId"
      (click)="figuresShown.set(!figuresShown())">{{ figuresShown() ? t('hide') : t('show') }}</button>
  </div>
  @defer (on viewport) {
    <backoffice-echarts-chart [build]="build()" />
  } @placeholder {
    <div class="h-[var(--chart-block-size,12.5rem)]"></div>
  }
  <table [id]="tableId" class="figures border-collapse text-2xs tabular-nums" [class.sr-only]="!figuresShown()">
    <caption class="text-start text-muted">{{ caption() }}</caption>
    <thead>
      <tr><th scope="col" class="border-b border-hairline px-2 py-1 text-end"></th>
        @for (series of data().series; track series.key) { <th scope="col" class="border-b border-hairline px-2 py-1 text-end">{{ series.label }}</th> }
      </tr>
    </thead>
    <tbody>
      @for (category of data().categories; track $index; let row = $index) {
        <tr><th scope="row" class="border-b border-hairline px-2 py-1 text-start">{{ category }}</th>
          @for (series of data().series; track series.key) { <td class="border-b border-hairline px-2 py-1 text-end">{{ format()(series.values[row]) }}</td> }
        </tr>
      }
    </tbody>
  </table>
</figure>
