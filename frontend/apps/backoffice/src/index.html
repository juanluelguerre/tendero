<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Tendero Backoffice</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The SVG first, for every browser that takes one. The .ico is the
         fallback, and it is generated FROM the same brand icon: the one Nx
         scaffolded was still sitting here, identical in both apps, so a
         browser that preferred it showed the framework's logo on the
         shop's tab. -->
    <link rel="icon" type="image/svg+xml" href="brand/tendero-icon-backoffice.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <!-- The theme before the first paint (the redesign's R-3). ThemeStore owns the
         choice once Angular runs; this only keeps the page from flashing the
         wrong one while it starts. Same key and rule as ThemeStore. -->
    <script>
      try {
        var choice = localStorage.getItem('tendero.theme');
        var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <backoffice-root></backoffice-root>
  </body>
</html>
