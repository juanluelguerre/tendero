<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="presentation">
  <!-- Hogar · Home. A lamp and a pan, which are the two sections underneath it
       that the catalogue actually has products in. -->
  <rect width="400" height="300" fill="#FAECE7"/>
  <rect x="0" y="0" width="400" height="34" fill="#D85A30"/>
  <g fill="#FAECE7">
    <rect x="26" y="0" width="26" height="34"/>
    <rect x="78" y="0" width="26" height="34"/>
    <rect x="130" y="0" width="26" height="34"/>
    <rect x="182" y="0" width="26" height="34"/>
    <rect x="234" y="0" width="26" height="34"/>
    <rect x="286" y="0" width="26" height="34"/>
    <rect x="338" y="0" width="26" height="34"/>
  </g>
  <rect x="0" y="34" width="400" height="4" fill="#993C1D"/>
  <!-- One scale for all of them, so three cards side by side do not look like
       three different illustrators. -->
  <g transform="translate(200 184) scale(1.16) translate(-200 -184)">
    <path d="M116 250 L116 178 L158 138" fill="none" stroke="#2C2C2A" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="116" cy="252" rx="38" ry="9" fill="#2C2C2A"/>
    <g transform="rotate(-38 168 140)">
      <path d="M142 118 h52 l16 40 h-84 z" fill="#D85A30"/>
    </g>
    <rect x="228" y="200" width="86" height="10" rx="5" fill="#2C2C2A"/>
    <path d="M232 212 h78 l-9 40 a10 10 0 0 1 -10 8 h-40 a10 10 0 0 1 -10 -8 z" fill="#D85A30"/>
    <rect x="314" y="216" width="52" height="10" rx="5" fill="#2C2C2A"/>
    <rect x="70" y="262" width="260" height="8" rx="4" fill="#2C2C2A" opacity=".35"/>
  </g>
</svg>
