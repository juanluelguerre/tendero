<ng-container *transloco="let t">
  @let value = cell();
  @if (value.source === 'none') {
    <!-- No data, said as such: a comparison that left the cell blank would let
         the eye fill it in, and one that guessed would be lying. -->
    <span class="text-muted italic">{{ t('specs.noData') }}</span>
  } @else {
    @switch (value.kind) {
      @case ('Boolean') {
        {{ value.flag ? t('product.yes') : t('product.no') }}
      }
      @case ('Number') {
        <span class="numeric">{{ value.number }}</span>
        @if (value.unit) {
          <span class="ms-1 text-muted">{{ value.unit }}</span>
        }
      }
      @default {
        {{ value.value }}
      }
    }
  }
</ng-container>
