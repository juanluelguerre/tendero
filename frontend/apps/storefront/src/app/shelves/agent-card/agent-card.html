<section class="agent" *transloco="let t" aria-labelledby="agent-card-title">
  <span class="agent__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" focusable="false">
      <rect x="5" y="8" width="14" height="11" rx="3" /><path d="M12 4v4M9 13h.01M15 13h.01M9 16h6" />
    </svg>
  </span>

  <div class="agent__words">
    <h2 class="agent__title" id="agent-card-title">{{ t('agentCard.title') }}</h2>
    <p class="agent__lede">{{ t('agentCard.lede') }}</p>
  </div>

  <div class="agent__address">
    <span class="agent__label eyebrow" id="agent-card-address">{{ t('agentCard.address') }}</span>
    <lib-copy-text class="agent__field" [value]="mcp" [copyLabel]="t('agentCard.copy')" [copiedLabel]="t('agentCard.copied')" />
  </div>

  <a class="agent__how" [routerLink]="howTo()">{{ t('agentCard.howTo') }}</a>
</section>
