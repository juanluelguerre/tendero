<!-- An invitation, on the accent's tint; the campaign above keeps the clay action. -->
<section
  class="grid grid-cols-[auto_minmax(0,1fr)_auto_auto] items-center gap-5 rounded-lg bg-accent-tint px-6 py-5 max-tab:grid-cols-[auto_minmax(0,1fr)] max-tab:p-5"
  *transloco="let t"
  aria-labelledby="agent-card-title"
>
  <span class="grid size-[3rem] place-items-center rounded-full bg-surface" aria-hidden="true">
    <lib-icon class="size-[1.25rem] text-accent" name="bot" [stroke]="1.75" />
  </span>

  <div>
    <h2 class="text-lg" id="agent-card-title">{{ t('agentCard.title') }}</h2>
    <p class="mt-1 text-sm text-muted">{{ t('agentCard.lede') }}</p>
  </div>

  <div class="grid gap-1 max-tab:col-span-full">
    <span class="eyebrow" id="agent-card-address">{{ t('agentCard.address') }}</span>
    <lib-copy-text [value]="mcp" [copyLabel]="t('agentCard.copy')" [copiedLabel]="t('agentCard.copied')" />
  </div>

  <!-- Aligned with the address box, not with the label above it. -->
  <a
    class="inline-flex min-h-[2.75rem] items-center self-end rounded-md border border-hairline-strong bg-surface px-4 text-sm font-semibold text-body no-underline hover:border-muted max-tab:col-span-full max-tab:justify-self-start"
    [routerLink]="howTo()"
  >
    {{ t('agentCard.howTo') }}
  </a>
</section>
