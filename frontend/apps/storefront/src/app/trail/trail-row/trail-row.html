<storefront-product-row
  *transloco="let t"
  [heading]="t('home.trail')"
  [lede]="signedIn() ? t('home.trailLedeAccount') : t('home.trailLede')"
  [items]="items()"
  [removable]="true"
  via="trail"
  (removed)="trail.forget('View', $event.code)">
  <span shelfActions class="inline-flex items-center gap-4">
    <a
      class="inline-flex min-h-[1.5rem] items-center text-sm text-muted underline underline-offset-[0.2em] max-sm:hidden pointer-coarse:min-h-[2.75rem]"
      [routerLink]="links.account()"
      fragment="history"
    >{{ t('home.trailManage') }}</a>
    <button
      type="button"
      class="inline-flex min-h-[1.5rem] items-center text-sm font-semibold text-accent hover:underline pointer-coarse:min-h-[2.75rem]"
      (click)="trail.clear()"
    >{{ t('home.trailClear') }}</button>
  </span>

  @if (searches().length > 0) {
    <ul shelfExtras class="mt-3 flex flex-wrap items-center gap-2" [attr.aria-label]="t('home.trailSearches')">
      <li aria-hidden="true">
<lib-icon class="block size-[1rem] text-muted" name="history" [stroke]="2" />
      </li>
      @for (search of searches(); track search.key) {
        <li class="inline-flex items-center rounded-full border border-hairline bg-surface text-xs">
          <a
            class="inline-flex min-h-[1.75rem] items-center ps-3 pe-1 text-body no-underline hover:underline pointer-coarse:min-h-[2.75rem]"
            [routerLink]="links.home()"
            [queryParams]="{ q: search.key }"
          >{{ search.key }}</a>
          <button
            type="button"
            class="inline-grid size-[1.75rem] place-items-center rounded-full text-muted hover:text-body pointer-coarse:size-[2.75rem]"
            [attr.aria-label]="t('home.trailSearchRemove', { text: search.key })"
            (click)="trail.forget('Search', search.key)">×</button>
        </li>
      }
    </ul>
  }
</storefront-product-row>
