@if (consent.state() === 'unasked') {
  <section class="consent" role="region" aria-labelledby="consent-title" *transloco="let t">
    <div class="page-frame consent__inner">
      <p class="consent__text">
        <strong id="consent-title">{{ t('consent.title') }}</strong>
        {{ t('consent.body') }}
      </p>
      <div class="consent__actions">
        <button type="button" class="button button--quiet" (click)="consent.deny()">{{ t('consent.decline') }}</button>
        <button type="button" class="button button--quiet" (click)="consent.grant()">{{ t('consent.accept') }}</button>
      </div>
    </div>
  </section>
}
