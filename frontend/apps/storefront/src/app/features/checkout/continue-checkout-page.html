<ng-container *transloco="let t">
  <section class="max-w-prose py-7" aria-live="polite">
    @switch (store.state()) {
      @case ('taking-over') {
        <p class="text-muted">{{ t('checkout.continue.takingOver') }}</p>
      }
      @case ('gone') {
        <h1 class="mb-3 text-xl">{{ t('checkout.continue.goneTitle') }}</h1>
        <p class="text-muted">{{ t('checkout.continue.gone') }}</p>
        <a class="text-body" [routerLink]="links.home()">{{ t('checkout.continue.backToShop') }}</a>
      }
      @case ('failed') {
        <p class="text-muted" role="alert">{{ t('checkout.continue.failed') }}</p>
      }
    }
  </section>
</ng-container>
