@if (door.isOpen()) {
  @if (door.wide()) {
    <!-- Beside the page, over nothing: the shell has made the room. The panel loads as
         soon as the door opens (on immediate) — the shopper has asked for it. -->
    <aside
      class="fixed inset-y-0 end-0 z-20 w-panel border-s border-hairline-strong bg-surface"
      [attr.aria-label]="name()"
    >
      @defer (on immediate) {
        <storefront-tino-panel class="h-full" />
      }
    </aside>
  } @else {
    <!-- The sheet: a modal dialog, full screen. Esc closes it through its own close
         event, which closes the door too. -->
    <dialog
      class="m-0 h-dvh max-h-none w-full max-w-none border-0 bg-surface p-0 text-body"
      #sheet
      (close)="door.close()"
      [attr.aria-label]="name()"
    >
      @defer (on immediate) {
        <storefront-tino-panel class="h-full" />
      }
    </dialog>
  }
}
