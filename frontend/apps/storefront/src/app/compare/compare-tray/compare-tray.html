<ng-container *transloco="let t">
  @if (compare.items().length > 0) {
    <aside class="border-t border-hairline bg-surface shadow-pop" [attr.aria-label]="t('compare.tray')">
      <div class="page-frame flex flex-wrap items-center justify-between gap-3 py-3">
        <ul class="flex min-w-0 flex-wrap gap-2">
          @for (item of compare.items(); track item.code) {
            <li
              class="inline-flex max-w-[16rem] items-center gap-1 rounded-full border border-hairline bg-raised px-2 py-1 text-xs"
            >
              <span class="truncate">{{ item.name }}</span>
              <button
                class="px-1 text-muted"
                type="button"
                [attr.aria-label]="t('compare.remove', { name: item.name })"
                (click)="compare.toggle(item)"
              >
                ×
              </button>
            </li>
          }
        </ul>
        <div class="flex items-center gap-4">
          <button class="px-1 text-xs text-muted underline" type="button" (click)="compare.clear()">
            {{ t('compare.clear') }}
          </button>
          @if (compare.items().length > 1) {
            <!-- A secondary action: the page's clay stays with adding to the cart. -->
            <a
              class="rounded-md border border-body px-4 py-2 text-sm text-body no-underline hover:bg-raised"
              [routerLink]="links.compare()"
              [queryParams]="query()"
            >
              {{ t('compare.go', { count: compare.items().length }) }}
            </a>
          } @else {
            <span class="text-xs text-muted">{{ t('compare.pickAnother') }}</span>
          }
        </div>
      </div>
    </aside>
  }
</ng-container>
