<ng-container *transloco="let t">
  @let who = identity();
  <button
    type="button"
    class="trigger inline-grid size-tap place-items-center rounded-full text-muted hover:bg-raised hover:text-body"
    popovertarget="account-menu"
    [attr.aria-label]="t('accountMenu.open', { name: who?.name ?? t('accountMenu.guest') })"
  >
    @if (who) {
      <span
        class="inline-grid size-control-sm place-items-center rounded-full bg-accent-tint text-2xs font-semibold text-body"
        aria-hidden="true"
        >{{ initials() }}</span
      >
    } @else {
      <svg class="size-icon-lg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path
          d="M4.5 20a7.5 7.5 0 0 1 15 0"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
    }
  </button>

  <div
    #menu
    id="account-menu"
    class="menu w-[min(18rem,calc(100vw-2*var(--spacing-4)))] flex-col gap-4 rounded-lg border border-hairline-strong bg-surface p-4 text-body shadow-pop open:flex"
    popover
  >
    <p>
      <strong>{{ who?.name ?? t('accountMenu.guest') }}</strong>
    </p>

    <lib-culture-switch [label]="t('nav.language')" [cultures]="cultures" [active]="culture()" (chosen)="use($event)" />

    <lib-theme-switch
      [label]="t('theme.label')"
      [names]="{ system: t('theme.system'), light: t('theme.light'), dark: t('theme.dark') }"
      [choice]="themeChoice()"
      (chosen)="choose($event)"
    />

    <div class="flex flex-wrap justify-between gap-3 border-t border-hairline pt-3">
      @if (who) {
        <a class="quiet" [routerLink]="accountLink()" (click)="close()">{{ t('account.title') }}</a>
        <button type="button" class="quiet" (click)="signOut()">{{ t('account.signOut') }}</button>
      } @else {
        <!-- To the account page and not straight to the issuer: that page is
             where signing in finishes, with the customer linked and the basket
             claimed. -->
        <a class="quiet" [routerLink]="accountLink()" (click)="close()">{{ t('account.signIn') }}</a>
      }
    </div>
  </div>
</ng-container>
