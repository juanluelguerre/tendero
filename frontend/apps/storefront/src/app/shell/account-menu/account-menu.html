<ng-container *transloco="let t">
  @let who = identity();
  <button
    type="button"
    class="trigger inline-grid size-[44px] place-items-center rounded-full text-muted hover:bg-raised hover:text-body"
    popovertarget="account-menu"
    [attr.aria-label]="t('accountMenu.open', { name: who?.name ?? t('accountMenu.guest') })"
  >
    @if (who) {
      <span class="inline-grid size-[2rem] place-items-center rounded-full bg-accent-tint text-2xs font-semibold text-body" aria-hidden="true">{{ initials() }}</span>
    } @else {
      <svg class="size-[22px]" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M4.5 20a7.5 7.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
    }
  </button>

  <div
    #menu
    id="account-menu"
    class="menu w-[min(18rem,calc(100vw-2*var(--space-4)))] flex-col gap-4 rounded-lg border border-hairline-strong bg-surface p-4 text-body shadow-pop open:flex"
    popover
  >
    <p>
      <strong>{{ who?.name ?? t('accountMenu.guest') }}</strong>
    </p>

    <div class="flex items-center justify-between gap-3">
      <span class="text-xs text-muted" id="account-language">{{ t('nav.language') }}</span>
      <div class="inline-flex overflow-hidden rounded-md border border-hairline-strong" role="group" aria-labelledby="account-language">
        @for (option of cultures; track option) {
          <button
            type="button"
            class="inline-grid min-h-[2.25rem] min-w-[2.75rem] place-items-center px-2 text-xs uppercase text-muted hover:text-body aria-pressed:bg-accent-tint aria-pressed:font-semibold aria-pressed:text-body pointer-coarse:min-h-[2.75rem]"
            [attr.aria-pressed]="option === culture()"
            (click)="use(option)"
          >
            {{ option }}
          </button>
        }
      </div>
    </div>

    <div class="flex items-center justify-between gap-3">
      <span class="text-xs text-muted" id="account-theme">{{ t('theme.label') }}</span>
      <div class="inline-flex overflow-hidden rounded-md border border-hairline-strong" role="group" aria-labelledby="account-theme">
        @for (choice of themes; track choice) {
          <button
            type="button"
            class="inline-grid min-h-[2.25rem] min-w-[2.75rem] place-items-center px-2 text-xs uppercase text-muted hover:text-body aria-pressed:bg-accent-tint aria-pressed:font-semibold aria-pressed:text-body pointer-coarse:min-h-[2.75rem]"
            [attr.aria-pressed]="choice === themeChoice()"
            [attr.aria-label]="t('theme.' + choice)"
            [title]="t('theme.' + choice)"
            (click)="choose(choice)"
          >
            <svg class="size-[1.125rem]" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              @switch (choice) {
                @case ('system') {
                  <rect x="3.5" y="4.5" width="17" height="11.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6" />
                  <path d="M9 20h6M12 16v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                }
                @case ('light') {
                  <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
                  <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                }
                @case ('dark') {
                  <path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                }
              }
            </svg>
          </button>
        }
      </div>
    </div>

    <div class="flex flex-wrap justify-between gap-3 border-t border-hairline pt-3">
      @if (who) {
        <a class="quiet" [routerLink]="accountLink()" (click)="close()">{{ t('account.title') }}</a>
        <button type="button" class="quiet" (click)="signOut()">{{ t('account.signOut') }}</button>
      } @else {
        <!-- To the account page and not straight to the issuer: that page is
             where signing in finishes, with the customer linked and the basket
             claimed. -->
        <a class="quiet" [routerLink]="accountLink()" (click)="close()">{{ t('account.signIn') }}</a>
      }
    </div>
  </div>
</ng-container>
