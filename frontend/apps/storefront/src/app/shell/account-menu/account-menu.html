<ng-container *transloco="let t">
  @let who = identity();
  <button
    type="button"
    class="trigger inline-grid size-tap place-items-center rounded-full text-muted hover:bg-raised hover:text-body"
    popovertarget="account-menu"
    [attr.aria-label]="t('accountMenu.open', { name: who?.name ?? t('accountMenu.guest') })"
  >
    @if (who) {
      <span
        class="inline-grid size-control-sm place-items-center rounded-full bg-accent-tint text-2xs font-semibold text-body"
        aria-hidden="true"
        >{{ initials() }}</span
      >
    } @else {
      <svg class="size-icon-lg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path
          d="M4.5 20a7.5 7.5 0 0 1 15 0"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
    }
  </button>

  <div
    #menu
    id="account-menu"
    class="menu w-[min(18rem,calc(100vw-2*var(--spacing-4)))] flex-col gap-4 rounded-lg border border-hairline-strong bg-surface p-4 text-body shadow-pop open:flex"
    popover
  >
    <p class="grid gap-hair">
      <strong>{{ who?.name ?? t('accountMenu.guest') }}</strong>
      <span class="text-sm text-muted">{{ who ? t('accountMenu.signedIn') : t('accountMenu.signedOut') }}</span>
    </p>

    <lib-culture-switch [label]="t('nav.language')" [cultures]="cultures" [active]="culture()" (chosen)="use($event)" />

    <lib-theme-switch
      [label]="t('theme.label')"
      [names]="{ system: t('theme.system'), light: t('theme.light'), dark: t('theme.dark') }"
      [choice]="themeChoice()"
      (chosen)="choose($event)"
    />

    <!-- Rows, each the width of the menu with its icon, as the prototype drew them
         (the author, 2026-10-21): a list of places to go, not links side by side. -->
    <div class="-mx-2 grid gap-1 border-t border-hairline pt-3">
      @if (who) {
        <!-- The way into the account is this menu: the header carries no link of its own (the author, 2026-10-20). -->
        <a
          class="flex min-h-control-md items-center gap-3 rounded-md px-2 font-medium text-body no-underline hover:bg-raised pointer-coarse:min-h-tap"
          [routerLink]="accountLink()"
          (click)="close()"
        >
          <lib-icon class="size-icon text-muted" name="person" />
          {{ t('accountMenu.profile') }}
        </a>
        <button
          type="button"
          class="flex min-h-control-md cursor-pointer items-center gap-3 rounded-md border-0 bg-transparent px-2 text-start text-body hover:bg-raised pointer-coarse:min-h-tap"
          (click)="signOut()"
        >
          <lib-icon class="size-icon text-muted" name="signOut" />
          {{ t('account.signOut') }}
        </button>
      } @else {
        <!-- To the account page and not straight to the issuer: that page is
             where signing in finishes, with the customer linked and the basket
             claimed. -->
        <a
          class="flex min-h-control-md items-center gap-3 rounded-md px-2 font-medium text-body no-underline hover:bg-raised pointer-coarse:min-h-tap"
          [routerLink]="accountLink()"
          (click)="close()"
        >
          <lib-icon class="size-icon text-muted" name="signIn" />
          {{ t('account.signIn') }}
        </a>
      }
    </div>
  </div>
</ng-container>
