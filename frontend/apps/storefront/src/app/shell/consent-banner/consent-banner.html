@if (consent.state() === 'unasked') {
  <!-- Sticky to the foot of the viewport rather than fixed: it stays in view
       while the page scrolls, and at the end of the page it takes its own place
       after the footer instead of lying over the last of the content — fixed, it
       hid the cart's totals (found by the checkout e2e, P9b-7). Below the sticky
       header's layer, so it never covers the search box people came for. -->
  <section
    class="sticky bottom-0 z-5 border-t border-hairline bg-surface shadow-pop"
    role="region"
    aria-labelledby="consent-title"
    *transloco="let t"
  >
    <div class="page-frame flex flex-wrap items-center justify-between gap-x-5 gap-y-3 py-4">
      <p class="flex-[1_1_32rem] leading-snug text-body">
        <strong id="consent-title">{{ t('consent.title') }}</strong>
        {{ t('consent.body') }}
      </p>
      <div class="flex gap-3">
        <button type="button" class="button button--quiet" (click)="consent.deny()">{{ t('consent.decline') }}</button>
        <button type="button" class="button button--quiet" (click)="consent.grant()">{{ t('consent.accept') }}</button>
      </div>
    </div>
  </section>
}
