<ng-container *transloco="let t">
  @let item = hit();
  @let source = imageUrl();

  <!-- The picture goes to the product too — and so does the placeholder,
       which used to sit outside the link: on 82 of 100 cards the biggest thing
       on them went nowhere (UI review, 2026-09-11). Hidden from the keyboard
       and from screen readers, because the name below is the one link they
       need. -->
  <a class="card__media" [routerLink]="links.product(item.slug, item.code)" tabindex="-1" aria-hidden="true">
    @if (source) {
      <img
        class="card__image"
        [src]="source"
        [alt]="item.name"
        loading="lazy"
        (error)="broken.set(true)"
      />
    } @else {
      <!-- A default state, not a gap: a card with no picture has to look
           deliberate. -->
      <storefront-product-image-placeholder
        class="card__image card__image--fallback"
        [alt]="t('product.noImage')"
        [label]="t('product.noImage')" />
    }
  </a>

  <div class="card__body">
    @if (item.brand) {
      <p class="card__brand eyebrow">{{ item.brand }}</p>
    }

    <!-- The whole card is not the link; the NAME is. A card whose every pixel
         navigates cannot also hold an add button, and the heading is what a
         screen reader reads out as the destination. -->
    <h3 class="card__name">
      <a class="card__link" [routerLink]="links.product(item.slug, item.code)">{{ item.name }}</a>
    </h3>

    <p class="card__price numeric">{{ price() }}</p>

    <!-- Only when it cannot be bought. "In stock" on every card is a label, not
         information; the absence is the default and the presence is the news. -->
    @if (!item.inStock) {
      <p class="card__soldOut">{{ t('product.soldOut') }}</p>
    } @else {
      <button class="card__add" type="button" [disabled]="adding()" (click)="addToCart()">
        {{ adding() ? '…' : t('product.addToCart') }}
      </button>
    }
  </div>
</ng-container>
