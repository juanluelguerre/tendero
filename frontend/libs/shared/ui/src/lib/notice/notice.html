<div
  class="rounded-md border border-s-[3px] border-hairline bg-surface px-4 py-3 text-body"
  [class.border-s-muted]="tone() === 'info'"
  [class.border-s-positive]="tone() === 'good'"
  [class.border-s-warning]="tone() === 'warn'"
  [class.border-s-danger]="tone() === 'bad'"
  [attr.data-tone]="tone()"
  [attr.role]="role()"
>
  <ng-content />
</div>
